name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests (synthetic data only)
        run: python -m pytest -q -m "not integration and not needs_data"
      - name: Integration tests (synthetic data only)
        run: python -m pytest -q -m integration
