[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegpipe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "pyarrow",
    "numba",
    "PyWavelets",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: slow tests",
    "integration: full-chain integration tests",
    "needs_data: requires real (non-synthetic) data, skipped in CI",
]
